<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>취업 준비 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf4e6; --paper2:#f3e6cc; --card:#fffaf0; --ink:#2a2017; --ink2:#6b5a47;
  --orange:#ef8a2f; --mustard:#f4c34d; --mint:#4fae9c; --red:#d9533d; --pink:#f6b3a8; --sky:#9ccbe0;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  background-image:radial-gradient(rgba(42,32,23,.07) 1.2px,transparent 1.2px);
  background-size:22px 22px;
  color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
h1,h2,h3,.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* 머리 */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:3px solid var(--ink);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.brand{font-family:'Jua';font-size:21px;display:flex;align-items:center;gap:8px;white-space:nowrap}
@media (max-width:400px){.brand{font-size:18px}.brand i{width:17px;height:17px}.stat{font-size:11.5px;padding:2px 8px}}
.brand i{width:20px;height:20px;border:3px solid var(--ink);border-radius:50%;background:var(--orange);display:inline-block}
.stat{font-size:12.5px;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;background:#fff;white-space:nowrap}
.stat::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mint);vertical-align:1px}
.stat.saving::before{background:var(--mustard)}
.stat.local::before,.stat.error::before{background:var(--red)}
.stat.load::before{background:#bbb}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:3px solid var(--ink);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px 0;font-family:'Jua';font-size:17px;text-align:center}
.tab.on{background:var(--ink);color:var(--paper)}

/* 공통 */
main{padding:18px 0 10px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:18px}
.card h3{font-size:19px;margin-bottom:10px}
.sub{font-size:13.5px;color:var(--ink2);font-weight:500}
.empty{padding:18px 8px;text-align:center;color:var(--ink2);font-weight:700;font-size:14.5px;border:2.5px dashed var(--ink);border-radius:12px;background:#fff}
.chip{display:inline-block;border:2.5px solid var(--ink);border-radius:99px;padding:3px 12px;font-size:13.5px;font-weight:700;background:#fff}

/* 오늘 */
.hero .date{font-size:14px;font-weight:700;color:var(--ink2)}
.hero .big{font-family:'Jua';font-size:30px;line-height:1.25;margin:2px 0 12px}
.hero .big b{font-weight:400;color:var(--orange);-webkit-text-stroke:.6px var(--ink)}
.meter{height:20px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-right:3px solid var(--ink)}
.meter i.zero{border-right:0}
.hero .row{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13.5px;font-weight:700}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px 10px 10px;text-align:left;box-shadow:3px 3px 0 var(--ink);min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.cat .dot{width:22px;height:22px;border:3px solid var(--ink);border-radius:50%;display:block}
.cat b{font-family:'Jua';font-weight:400;font-size:17px;display:block;line-height:1.2;margin-top:6px}
.cat small{position:absolute;right:10px;top:8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.cat.on{background:var(--mustard);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cat:last-child:nth-child(odd){grid-column:1 / -1}
.times{margin-top:14px;padding:14px;border:3px solid var(--ink);border-radius:14px;background:var(--paper2)}
.times p{font-family:'Jua';font-size:18px;margin-bottom:10px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:10px 16px;font-family:'Jua';font-size:18px;min-width:76px;box-shadow:3px 3px 0 var(--ink)}
.tchip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cust{display:flex;gap:8px;margin-top:10px}
.cust input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:17px;background:#fff}
.btn{border:3px solid var(--ink);border-radius:12px;background:var(--orange);padding:9px 16px;font-family:'Jua';font-size:17px;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:5px 12px;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.todaybar{display:flex;height:26px;border:3px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff;margin-bottom:12px}
.todaybar i{display:block;height:100%;border-right:3px solid var(--ink)}
.todaybar i:last-child{border-right:0}
.tl{display:grid;gap:8px}
.tl .r{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.tl .r .d{width:16px;height:16px;border:2.5px solid var(--ink);border-radius:50%;flex:none}
.tl .r span.v{margin-left:auto;font-family:'Jua'}
.tl .r button{border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:12.5px;font-weight:700;padding:1px 8px}

/* 대시보드 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.kpi{border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:3px 3px 0 var(--ink);padding:12px;text-align:center}
.kpi b{display:block;font-family:'Jua';font-weight:400;font-size:27px;line-height:1.15}
.kpi span{font-size:13px;font-weight:700;color:var(--ink2)}
.kpi.hl{background:var(--mustard)}
.kpi.hl span{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px;font-weight:700}
.legend span::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid var(--ink);border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c,#ddd)}
.legend span.line::before{border-radius:50%;background:var(--ink)}
.legend span.goal::before{background:none;border:0;border-top:3px dashed var(--red);border-radius:0;height:0;width:16px;vertical-align:4px}
svg.ch{width:100%;height:auto;display:block;max-width:760px;margin:0 auto}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:150px;height:150px;flex:none}
.dl{flex:1;min-width:150px;display:grid;gap:6px;font-size:14px;font-weight:700}
.dl div{display:flex;align-items:center;gap:8px}
.dl i{width:14px;height:14px;border:2.5px solid var(--ink);border-radius:50%;flex:none}
.dl em{font-style:normal;margin-left:auto;font-family:'Jua'}
.fun{display:grid;gap:8px}
.fun .f{display:grid;grid-template-columns:76px 1fr 76px;gap:8px;align-items:center;font-size:13.5px;font-weight:700}
.fun .bar{height:26px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.fun .bar i{display:block;height:100%;background:var(--sky);border-right:3px solid var(--ink)}
.fun .bar i.z{border-right:0}
.fun .rt{text-align:right;font-family:'Jua'}
.heat{display:grid;grid-template-columns:20px repeat(12,1fr);gap:4px;align-items:center;max-width:640px}
.heat .wd{font-size:11.5px;font-weight:700;color:var(--ink2);text-align:center}
.heat .c{aspect-ratio:1;border:2px solid var(--ink);border-radius:5px;background:#fff}
.heat .c.l1{background:#fbe0bf}.heat .c.l2{background:#f7c27d}.heat .c.l3{background:var(--orange)}.heat .c.l4{background:#b85a10}
.heat .c.fut{border-style:dashed;border-color:#bbb;background:transparent}

/* 지원 */
.form{display:grid;gap:10px}
.form input{width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px;margin-bottom:12px}
.app .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.app h4{font-family:'Jua';font-weight:400;font-size:19px;line-height:1.2}
.app .meta{font-size:12.5px;color:var(--ink2);font-weight:700}
.badge{font-size:12.5px;font-weight:700;border:2.5px solid var(--ink);border-radius:99px;padding:1px 10px;white-space:nowrap}
.badge.go{background:var(--sky)} .badge.win{background:var(--mint);color:#fff} .badge.out{background:var(--pink)}
.steps{display:flex;gap:4px;margin:10px 0}
.steps i{flex:1;height:12px;border:2.5px solid var(--ink);border-radius:6px;background:#fff}
.steps i.on{background:var(--mint)} .steps i.sk{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#ddd 4px,#ddd 8px)} .steps i.no{background:var(--red)}
.steplab{display:flex;gap:4px;font-size:11px;font-weight:700;color:var(--ink2);margin-top:-6px;margin-bottom:8px}
.steplab span{flex:1;text-align:center}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* 설정 */
.pref{display:grid;gap:10px}
.pref label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center}
.pref label i{width:20px;height:20px;border:3px solid var(--ink);border-radius:50%}
.pref input{border:3px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:16px;background:#fff;width:100%}
.goalrow{display:flex;align-items:center;gap:10px;font-weight:700}
.goalrow input{width:90px}
textarea{width:100%;height:110px;border:3px solid var(--ink);border-radius:12px;padding:8px;font-size:12px;background:#fff}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;display:flex;gap:12px;align-items:center;z-index:40;transition:.18s;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast span{white-space:nowrap}
.toast button{white-space:nowrap;border:2px solid var(--paper);background:transparent;color:var(--paper);border-radius:8px;font-weight:700;padding:1px 10px;font-size:14px}

@media (min-width:900px){
  body{padding-bottom:30px}
  .wrap{max-width:1040px}
  .tabs{position:static;border:0;background:none;padding:14px 16px 0}
  .tabs .in{max-width:1040px;grid-template-columns:repeat(4,160px);justify-content:start;padding:0 16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .apps{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
  .toast{bottom:30px}
  .dash{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
  .dash .full{grid-column:1 / -1}
  .cats{grid-template-columns:repeat(5,1fr)}
  .cat:last-child:nth-child(odd){grid-column:auto}
  .today{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
  .today .full{grid-column:1 / -1}
}
</style>
<style>
/* 제출용 데모: 상태 표시를 '샘플 데이터'로 고정 */
#stat{font-size:0!important}
#stat::after{content:'샘플 · 저장 안 됨';font-size:12.5px}
</style>

<script>
/* ===== 제출용 데모 전용: 메모리 안에서만 도는 샘플 저장소 (새로고침하면 처음으로) ===== */
(function(){
  var uid='u_demo',base='data/users/'+uid,store={},listeners=[];
  function pad(n){return n<10?'0'+n:''+n}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  var now=new Date(),days={},seed=11;
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  var ids=['theory','coding','portfolio','resume','interview'];
  for(var i=75;i>=1;i--){
    var dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
    if(rnd()<.26)continue;
    var o={};
    ids.forEach(function(id,k){
      var w=[.7,.55,.6,.25,.2][k]*(i<30?1.15:.8);
      if(rnd()<w)o[id]=[30,45,60,90,120,150][Math.floor(rnd()*6)];
    });
    if(Object.keys(o).length)days[ymd(dt)]=o;
  }
  var byMonth={};
  Object.keys(days).forEach(function(k){var m=k.slice(0,7);(byMonth[m]=byMonth[m]||{})[k]=days[k]});
  Object.keys(byMonth).forEach(function(m){store[base+'/logs-'+m]={days:byMonth[m]}});
  store[base+'/settings']={cats:[
    {id:'theory',name:'이론 공부',color:'#4f7cac'},{id:'coding',name:'코딩 테스트',color:'#5aa17f'},
    {id:'portfolio',name:'포트폴리오',color:'#ef8a2f'},{id:'resume',name:'지원서·자소서',color:'#d9533d'},
    {id:'interview',name:'면접 준비',color:'#d6a519'}],goal:900};
  function dstr(n){return ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-n))}
  store[base+'/apps']={items:[
    {id:'a1',company:'달빛게임즈',role:'Unity 클라이언트',date:dstr(50),stage:3,out:false,skip:false},
    {id:'a2',company:'별똥스튜디오',role:'Unity 클라이언트',date:dstr(44),stage:1,out:true,skip:false},
    {id:'a3',company:'포도게임즈',role:'클라이언트 개발',date:dstr(38),stage:4,out:false,skip:false},
    {id:'a4',company:'구름소프트',role:'Unity 클라이언트',date:dstr(31),stage:2,out:true,skip:false},
    {id:'a5',company:'모래시계 스튜디오',role:'모바일 클라이언트',date:dstr(25),stage:0,out:true,skip:false},
    {id:'a6',company:'고래게임즈',role:'클라이언트 개발',date:dstr(19),stage:2,out:false,skip:true},
    {id:'a7',company:'해바라기 소프트',role:'Unity 클라이언트',date:dstr(12),stage:1,out:false,skip:false},
    {id:'a8',company:'파도게임즈',role:'Unity 클라이언트',date:dstr(6),stage:0,out:false,skip:false},
    {id:'a9',company:'솜사탕 스튜디오',role:'클라이언트 개발',date:dstr(2),stage:0,out:false,skip:false}]};
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function snapDoc(p){var has=Object.prototype.hasOwnProperty.call(store,p);return {id:p.split('/').pop(),exists:has,data:function(){return has?clone(store[p]):undefined},metadata:{fromCache:false,hasPendingWrites:false}}}
  function colDocs(path){return Object.keys(store).filter(function(k){return k.indexOf(path+'/')===0&&k.slice(path.length+1).indexOf('/')<0}).sort().map(snapDoc)}
  function colSnap(path){var ds=colDocs(path);return {docs:ds,size:ds.length,empty:!ds.length,docChanges:function(){return []},metadata:{fromCache:false,hasPendingWrites:false}}}
  function notify(){listeners.forEach(function(l){setTimeout(function(){l.next(colSnap(l.path))},5)})}
  function mkDoc(path){return {id:path.split('/').pop(),path:path,
    get:function(){return Promise.resolve(snapDoc(path))},
    set:function(d){return new Promise(function(res){setTimeout(function(){store[path]=clone(d);notify();res()},30)})},
    update:function(){return Promise.resolve()},delete:function(){delete store[path];notify();return Promise.resolve()},
    onSnapshot:function(n){setTimeout(function(){n(snapDoc(path))},0);return function(){}},
    collection:function(p){return mkCol(path+'/'+p)}}}
  function mkCol(path){return {path:path,doc:function(id){return mkDoc(path+'/'+(id||('auto'+Math.random())))},
    get:function(){return Promise.resolve(colSnap(path))},
    onSnapshot:function(next){var l={path:path,next:next};listeners.push(l);setTimeout(function(){next(colSnap(path))},30);return function(){}}}}
  window.__demoClaude={use:function(n){
    if(n==='db')return Promise.resolve({doc:function(p){return mkDoc(p)},collection:function(p){return mkCol(p)}});
    if(n==='user')return Promise.resolve({id:function(){return Promise.resolve(uid)}});
    return Promise.resolve(null)}};
})();
</script>
<header><div class="wrap"><div class="brand"><i></i>취업 준비 노트</div><div class="stat load" id="stat">불러오는 중</div></div></header>

<script>
(function(){
'use strict';
/* ---------- 도구 ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))}
function fmt(m){m=Math.round(m);if(m<=0)return '0분';var h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(h&&r?' ':'')+(r?r+'분':'')}
function pct(a,b){return b>0?Math.round(a/b*100):null}
var WD=['일','월','화','수','목','금','토'];

/* ---------- 상태 ---------- */
var DEFAULT_CATS=[
  {id:'theory',name:'이론 공부',color:'#4f7cac'},
  {id:'coding',name:'코딩 테스트',color:'#5aa17f'},
  {id:'portfolio',name:'포트폴리오',color:'#ef8a2f'},
  {id:'resume',name:'지원서·자소서',color:'#d9533d'},
  {id:'interview',name:'면접 준비',color:'#d6a519'}
];
var STEPS=['서류','과제·코테','면접','최종'];
var S={
  cats:JSON.parse(JSON.stringify(DEFAULT_CATS)), goal:900, logs:{}, apps:[],
  view:'today', sel:null, custom:false, last:null, loaded:false, note:'', form:{company:'',role:'Unity 클라이언트',date:''},
  confirmDel:null, backup:null, customMin:''
};
var store={mode:'init',col:null};
var today=function(){return new Date()};

/* ---------- 저장 계층 ---------- */
var q={};
function setStatus(kind,code){
  var el=$('#stat');if(!el)return;
  var t={saving:'저장 중…',saved:'저장됨',local:'이 기기에만 저장',load:'불러오는 중',error:'저장 실패'}[kind]||'';
  if(kind==='error'){
    if(code==='invalid_argument')t='쓰기 권한 없음';
    else if(code==='quota_exceeded')t='저장 공간 가득';
    else if(code==='revoked')t='접근 권한 바뀜';
  }
  el.className='stat '+kind;el.textContent=t;
}
function localKey(){return 'job-notes-v1'}
function localLoad(){try{var j=JSON.parse(localStorage.getItem(localKey())||'null');if(j){if(j.cats&&j.cats.length)S.cats=j.cats;if(+j.goal>0)S.goal=+j.goal;S.logs=j.logs||{};S.apps=j.apps||[]}}catch(e){}}
function localSave(){try{localStorage.setItem(localKey(),JSON.stringify({cats:S.cats,goal:S.goal,logs:S.logs,apps:S.apps}))}catch(e){}}
function payload(id){
  if(id==='settings')return {cats:S.cats,goal:S.goal};
  if(id==='apps')return {items:S.apps};
  var key=id.slice(5),days={};
  Object.keys(S.logs).forEach(function(d){if(d.indexOf(key)===0)days[d]=S.logs[d]});
  return {days:days};
}
function persist(id){
  if(store.mode!=='db'){localSave();setStatus('local');return}
  var e=q[id]||(q[id]={busy:false,dirty:false});
  if(e.busy){e.dirty=true;return}
  e.busy=true;setStatus('saving');
  (function run(){
    e.dirty=false;
    store.col.doc(id).set(payload(id)).then(function(){
      if(e.dirty)return run();
      e.busy=false;setStatus('saved');
    },function(err){e.busy=false;setStatus('error',err&&err.code)});
  })();
}
function busy(id){var e=q[id];return !!(e&&(e.busy||e.dirty))}
function applySnapshot(snap){
  var logs={};
  Object.keys(S.logs).forEach(function(d){if(busy('logs-'+d.slice(0,7)))logs[d]=S.logs[d]});
  snap.docs.forEach(function(d){
    var id=d.id,v=d.data()||{};
    if(id==='settings'){if(!busy('settings')){if(Array.isArray(v.cats)&&v.cats.length)S.cats=v.cats;if(+v.goal>0)S.goal=+v.goal}}
    else if(id==='apps'){if(!busy('apps'))S.apps=Array.isArray(v.items)?v.items:[]}
    else if(id.indexOf('logs-')===0&&!busy(id)){var days=v.days||{};Object.keys(days).forEach(function(k){logs[k]=days[k]})}
  });
  S.logs=logs;
}
async function initStore(){
  var c=window.__demoClaude,db=null,user=null,uid=null;
  try{if(c&&c.use){db=await c.use('db');user=await c.use('user');if(user)uid=await user.id()}}catch(e){}
  if(db&&uid){
    store.mode='db';store.col=db.collection('data/users/'+uid);
    var timer=setTimeout(function(){if(!S.loaded){S.note='데이터를 아직 못 불러왔어';render()}},10000);
    store.col.onSnapshot(function(snap){
      applySnapshot(snap);
      if(!snap.metadata||!snap.metadata.fromCache||snap.size>0){S.loaded=true;S.note='';clearTimeout(timer)}
      if(!Object.keys(q).some(busy))setStatus('saved');
      render();
    },function(err){S.loaded=true;setStatus('error',err&&err.code);render()});
  }else{
    store.mode='local';localLoad();S.loaded=true;
    S.note='claude.ai에 로그인하면 폰과 PC에 같이 저장돼';
    setStatus('local');render();
  }
}

/* ---------- 계산 ---------- */
function dayTotal(ds){var o=S.logs[ds],t=0;if(o)Object.keys(o).forEach(function(k){t+=+o[k]||0});return t}
function dayCat(ds,c){return (S.logs[ds]&&+S.logs[ds][c])||0}
function rangeTotal(from,days){var t=0;for(var i=0;i<days;i++)t+=dayTotal(ymd(addDays(from,i)));return t}
function catOf(id){for(var i=0;i<S.cats.length;i++)if(S.cats[i].id===id)return S.cats[i];return {id:id,name:id,color:'#999'}}
function streak(){
  var d=today(),n=0;
  if(dayTotal(ymd(d))<=0)d=addDays(d,-1);
  while(dayTotal(ymd(d))>0){n++;d=addDays(d,-1)}
  return n;
}
function addMin(cat,delta){
  var ds=ymd(today()),o=S.logs[ds]||(S.logs[ds]={});
  var v=Math.max(0,(+o[cat]||0)+delta);
  if(v>0)o[cat]=v;else delete o[cat];
  if(!Object.keys(o).length)delete S.logs[ds];
  persist('logs-'+ds.slice(0,7));
}
function stepStats(){
  var out=[];
  for(var k=1;k<=4;k++){
    var res=0,pass=0;
    S.apps.forEach(function(a){
      if(k===2&&a.skip)return;
      if(a.stage>=k){res++;pass++}
      else if(a.stage===k-1&&a.out)res++;
    });
    out.push({k:k,res:res,pass:pass,rate:pct(pass,res)});
  }
  return out;
}
function reached(j){return S.apps.filter(function(a){return a.stage>=j}).length}

function toast(msg,undoFn){
  var t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(undoFn?'<button data-act="undo">되돌리기</button>':'');

}
function weekBars(){
  var W=520,H=262,L=56,R=10,T=18,B=40,pw=W-L-R,ph=H-T-B;
  var start=monday(today()),weeks=[];
  for(var i=7;i>=0;i--){
    var ws=addDays(start,-7*i),segs={},tot=0,apps=0;
    for(var d=0;d<7;d++){
      var ds=ymd(addDays(ws,d)),o=S.logs[ds]||{};
      Object.keys(o).forEach(function(k){segs[k]=(segs[k]||0)+(+o[k]||0);tot+=(+o[k]||0)});
    }
    S.apps.forEach(function(a){var x=parseYmd(a.date||ymd(today()));if(x>=ws&&x<addDays(ws,7))apps++});
    weeks.push({ws:ws,segs:segs,tot:tot,apps:apps});
  }
  var maxM=Math.max(S.goal,Math.max.apply(null,weeks.map(function(w){return w.tot})))*1.12;
  var maxA=Math.max(3,Math.max.apply(null,weeks.map(function(w){return w.apps})));
  var gw=pw/8,bw=gw*.56,s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="최근 8주 투입 시간과 지원 건수">';
  [0,.5,1].forEach(function(f){
    var y=T+ph-ph*f;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#2a2017" stroke-opacity=".18" stroke-width="2"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="15" font-weight="700" fill="#6b5a47">'+Math.round(maxM*f/60)+'시간</text>';
  });
  var gy=T+ph-ph*(S.goal/maxM);
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="#d9533d" stroke-width="3" stroke-dasharray="7 6"/>';
  var pts=[];
  weeks.forEach(function(w,i){
    var x=L+gw*i+(gw-bw)/2,y=T+ph;
    S.cats.forEach(function(c){
      var m=w.segs[c.id]||0;if(m<=0)return;
      var h=ph*m/maxM;y-=h;
      s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" fill="'+c.color+'" stroke="#2a2017" stroke-width="2.5" rx="2"/>';
    });
    s+='<text x="'+(x+bw/2)+'" y="'+(H-16)+'" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2a2017">'+(w.ws.getMonth()+1)+'/'+w.ws.getDate()+'</text>';
    pts.push({x:x+bw/2,y:T+ph-ph*(w.apps/maxA),n:w.apps});
  });
  s+='<polyline points="'+pts.map(function(p){return p.x+','+p.y}).join(' ')+'" fill="none" stroke="#2a2017" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p){
    s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="5.5" fill="#fff" stroke="#2a2017" stroke-width="3"/>';
    if(p.n>0)s+='<text x="'+p.x+'" y="'+(p.y-11)+'" text-anchor="middle" font-size="17" font-family="Jua" fill="#2a2017">'+p.n+'</text>';
  });
  return s+'</svg>';
}
function donut(){
  var from=addDays(today(),-27),tot={},sum=0;
  for(var i=0;i<28;i++){var o=S.logs[ymd(addDays(from,i))]||{};Object.keys(o).forEach(function(k){tot[k]=(tot[k]||0)+(+o[k]||0);sum+=(+o[k]||0)})}
  if(sum<=0)return '<div class="empty">최근 4주 기록이 없어</div>';
  var r=52,C=2*Math.PI*r,off=0,arcs='';

    var m=tot[c.id]||0;if(m<=0)return;

    arcs+='<circle cx="75" cy="75" r="'+r+'" fill="none" stroke="'+c.color+'" stroke-width="26" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 75 75)"/>';
    off+=len;
  });

function funnel(){

function heat(){

var undoStack=null;
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  var WRITE=['add','addcustom','clear','addapp','pass','skip','out','undoapp','delyes','undo'];
  if(WRITE.indexOf(a)>=0&&!S.loaded){toast('불러오는 중이야. 잠깐만');return}
  if(a==='tab'){S.view=id;S.confirmDel=null;try{history.replaceState(null,'','#'+id)}catch(x){}render();window.scrollTo(0,0);return}
  if(a==='sel'){S.sel=(S.sel===id)?null:id;S.custom=false;render();return}
  if(a==='custom'){S.custom=!S.custom;render();return}
  if(a==='add'||a==='addcustom'){
    var m=a==='add'?+b.getAttribute('data-min'):parseInt(S.customMin,10);
    if(!(m>0)||m>1440){toast('1~1440분으로 넣어줘');return}
    addMin(S.sel,m);S.last={cat:S.sel,delta:m};S.customMin='';S.custom=false;render();
    toast(catOf(S.sel).name+' +'+fmt(m),true);return;
  }
  if(a==='undo'){if(S.last){addMin(S.last.cat,-S.last.delta);S.last=null;render();toast('취소했어')}return}
  if(a==='clear'){var ds=ymd(today()),prev=dayCat(ds,id);addMin(id,-prev);S.last={cat:id,delta:-prev};render();toast(catOf(id).name+' 지웠어',true);return}
  if(a==='addapp'){
    var f=S.form;
    if(!f.company.trim()){toast('회사 이름을 넣어줘');return}
    S.apps.push({id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),company:f.company.trim(),role:f.role.trim(),date:f.date||ymd(today()),stage:0,out:false,skip:false});
    f.company='';persist('apps');render();toast('지원 추가했어');return;
  }
  var app=S.apps.filter(function(x){return x.id===id})[0];
  if(a==='pass'&&app){app.stage=Math.min(4,app.stage+1);persist('apps');render();return}
  if(a==='skip'&&app){app.skip=true;app.stage=2;persist('apps');render();return}
  if(a==='out'&&app){app.out=true;persist('apps');render();return}
  if(a==='undoapp'&&app){if(app.out)app.out=false;else{app.stage=Math.max(0,app.stage-1);if(app.stage<2)app.skip=false}persist('apps');render();return}
  if(a==='del'){S.confirmDel=id;render();return}
  if(a==='delno'){S.confirmDel=null;render();return}
  if(a==='delyes'){S.apps=S.apps.filter(function(x){return x.id!==id});S.confirmDel=null;persist('apps');render();return}
  if(a==='backup'){
    S.backup=JSON.stringify({cats:S.cats,goal:S.goal,logs:S.logs,apps:S.apps});
    try{navigator.clipboard.writeText(S.backup).then(function(){toast('복사했어')},function(){toast('아래 글을 직접 복사해줘')})}catch(x){toast('아래 글을 직접 복사해줘')}
    render();return;
  }
});
document.addEventListener('input',function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute('data-f');
  if(f==='customMin')S.customMin=t.value;
  else if(f)S.form[f]=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(!S.loaded&&(t.hasAttribute('data-cat')||t.hasAttribute('data-goal'))){toast('불러오는 중이야. 잠깐만');render();return}
  if(t.hasAttribute('data-cat')){var i=+t.getAttribute('data-cat'),v=t.value.trim();if(v){S.cats[i].name=v.slice(0,12);persist('settings')}render()}
  else if(t.hasAttribute('data-goal')){var g=parseInt(t.value,10);if(g>=1&&g<=100){S.goal=g*60;persist('settings')}render()}
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(['today','dash','apps','prefs'].indexOf(h)>=0&&h!==S.view){S.view=h;render()}});

/* ---------- 시작 ---------- */
(function(){var h=location.hash.slice(1);if(['today','dash','apps','prefs'].indexOf(h)>=0)S.view=h})();
render();
initStore();
})();
</script>
</body>
</html>
